<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">

<title>Trilha Coração Branco</title>
<style>
:root{--bg:#fff;--c:#F2F2F3;--t:#0B0B0C;--m:#6E7072;--l:#E4161B;--g:#22A94A;--b:#E6E6E8}
body.dk{--bg:#0A0A0B;--c:#1B1B1D;--t:#fff;--m:#9C9EA1;--b:#2B2B2E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;height:100%;position:relative;overflow:hidden;background:var(--bg)}
main{height:100%;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(96px + env(safe-area-inset-bottom))}
main.nn{padding-bottom:calc(30px + env(safe-area-inset-bottom))}
h1{font-size:28px;margin:6px 0}h2,h3{margin:8px 0}small,.m{color:var(--m);font-size:12.5px;line-height:1.5}.m{font-size:14px}
a{color:var(--l);cursor:pointer}.lime{color:var(--l)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px}
.ib{background:0;border:0;color:var(--t);padding:4px;position:relative;display:flex}.dot{position:absolute;top:2px;right:3px;width:9px;height:9px;border-radius:50%;background:var(--l)}
.sos{background:var(--l);color:#fff;border:0;border-radius:12px;padding:9px 14px;font-weight:900;display:inline-flex;gap:6px;align-items:center}.sos.s{padding:5px 10px;font-size:12px;border-radius:9px}
.hi{display:flex;align-items:center;justify-content:space-between}
.blk{background:#0B0B0C;color:#fff;border-radius:18px;padding:18px;display:flex;justify-content:space-between;align-items:center;margin:6px 0 4px}.blk h2{margin:4px 0 0}
.row{display:flex;gap:10px;margin:10px 0}
.stat{flex:1;background:var(--c);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px}.stat b{font-size:18px}
.card{background:var(--c);border-radius:16px;padding:15px;margin:12px 0}.card.rw{display:flex;align-items:center;gap:12px}
.vs{font-size:18px;line-height:1.4;margin:6px 0}
.hero{background:linear-gradient(#0004,#000c),url(img/banner.jpg) center/cover,linear-gradient(135deg,#2b2b2e,#7a1414);color:#fff;min-height:112px;display:flex;justify-content:space-between;align-items:flex-end}.hero small{color:#ddd}.hero h3{margin:2px 0 0;font-size:20px}
.pl{width:40px;height:40px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;flex:none}
.btn{border:0;border-radius:14px;padding:16px;font-weight:800;font-size:15px;color:#fff;background:#0B0B0C;width:100%;cursor:pointer}
.btn.r{background:var(--l)}.btn.g{background:var(--c);color:var(--t)}.btn.o{background:0;border:1.5px solid var(--b);color:var(--t)}.btn.w{background:#fff;color:#0B0B0C}.btn small{color:#fff;opacity:.85;font-weight:400}.btn:disabled{opacity:.4}
.chip{background:var(--c);color:var(--t);border:0;border-radius:12px;padding:9px 16px;font-weight:700}.chip.on{background:#0B0B0C;color:#fff}
textarea,input{width:100%;background:var(--c);color:var(--t);border:1px solid var(--b);border-radius:14px;padding:13px;font:inherit;margin-top:8px}textarea{min-height:90px;resize:none}
.fc{display:flex;justify-content:space-between}.fc button{background:0;border:0;color:var(--t);padding:2px}.fc .on{color:var(--l)}
nav{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--b);display:flex;padding:6px 0 env(safe-area-inset-bottom)}
nav button{flex:1;background:0;border:0;color:var(--m);padding:6px 0;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}nav .on{color:var(--l);font-weight:700}
.tr{display:flex;gap:14px;padding-bottom:20px;position:relative}.tr:before{content:'';position:absolute;left:17px;top:38px;bottom:0;width:2px;background:#3a3a3d}.tr:last-child:before{display:none}
.nd{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;border:3px solid #fff;background:#4a4a4d;color:#fff}.nd.d{background:var(--g)}.nd.c{background:var(--l)}
.dh{margin:calc(-14px - env(safe-area-inset-top)) -18px 0;padding:calc(14px + env(safe-area-inset-top)) 18px 46px;background:linear-gradient(#0003,#000d),url(img/banner.jpg) center/cover,linear-gradient(135deg,#2b2b2e,#7a1414)}
.sh2{background:var(--bg);margin-top:-26px;border-radius:24px 24px 0 0;padding:6px 2px;position:relative}
.qv{font-style:italic;font-weight:700;font-size:19px;text-align:center;line-height:1.35}.bar{border-left:3px solid var(--l);padding-left:12px;margin:16px 0}
.ib2{width:48px;height:48px;border-radius:50%;border:0;background:var(--c);color:var(--t);display:flex;align-items:center;justify-content:center;font-weight:800}.ib2.bk{background:#0B0B0C;color:#fff;width:60px;height:60px}
.big{font-size:46px;font-weight:800}
.ent{background:var(--c);border-radius:14px;padding:13px;margin:9px 0;display:flex;gap:12px;align-items:center}.ic{width:32px;height:32px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.stk{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom));padding:10px 0;background:linear-gradient(transparent,var(--bg) 40%)}
.bd{width:50px;height:50px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;margin:0 auto 4px;font-size:22px}.bd.on{background:linear-gradient(#F6C646,#E08A12)}
.pb{height:8px;background:var(--c);border-radius:6px;overflow:hidden}.pb i{display:block;height:100%;background:var(--l)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal div{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px}.cal .h{color:var(--m)}
.cal .v{background:var(--g);color:#fff}.cal .r{background:var(--l);color:#fff}.cal .t{outline:2px solid var(--t)}
.step{display:flex;gap:12px;margin:12px 0}.num{width:24px;height:24px;border-radius:50%;background:var(--l);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:none}
.alr{width:46px;height:46px;border-radius:50%;background:var(--l);color:#fff;font-weight:900;font-size:26px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
#sheet{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:10}#sheet.on{display:flex}
#sheet>div{--bg:#fff;--c:#F2F2F3;--t:#0B0B0C;--m:#6E7072;--b:#E6E6E8;background:#fff;color:#0B0B0C;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));width:100%;max-height:92%;overflow-y:auto}
#lk{position:absolute;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;background:linear-gradient(#0008,#000e),url(img/abertura.jpg) center/cover,#111;color:#fff}#lk.on{display:flex}#lk .btn{max-width:340px}
.m2{color:#cfcfcf;margin:0}#dots{display:flex;gap:12px;margin:10px}#dots i{width:14px;height:14px;border-radius:50%;border:2px solid #fff7}#dots i.f{background:#fff}
#dots.sh{animation:sk .3s}@keyframes sk{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;margin:6px 0}.pad button{height:72px;border-radius:50%;border:0;background:#ffffff22;color:#fff;font-size:26px}.pad button:empty{visibility:hidden}
.ck{display:flex;gap:10px;align-items:flex-start;background:var(--c);border-radius:12px;padding:12px;margin:8px 0;font-size:15px;line-height:1.45}.ck input{width:20px;height:20px;padding:0;margin:2px 0 0;flex:none;accent-color:#E4161B}input[type=range]{accent-color:#E4161B}details{margin:10px 0}summary{color:var(--l);font-weight:700;cursor:pointer}.ib2:disabled{opacity:.3}</style></head><body><div id="app"><main id="m"></main>
<div id="lk"></div><nav id="nav"></nav><div id="sheet"><div id="sh"></div></div></div>
<script src="conteudo.js"></script>
<script>
const $=s=>document.querySelector(s),K='cb1';
const V=[["Cria em mim, ó Deus, um coração puro e renova em mim um espírito reto.","Salmos 51:10"],["Guardei no meu coração as tuas palavras, para não pecar contra ti.","Salmos 119:11"],["Fiel é Deus, que não vos deixará tentar acima do que podeis.","1 Coríntios 10:13"],["Perto está o Senhor dos que têm o coração quebrantado.","Salmos 34:18"],["Guarda o teu coração, porque dele procedem as saídas da vida.","Provérbios 4:23"],["Agora nenhuma condenação há para os que estão em Cristo Jesus.","Romanos 8:1"],["Não nos cansemos de fazer o bem, porque a seu tempo ceifaremos.","Gálatas 6:9"]];
const TEMAS=["Compromisso Verdadeiro","Entendendo o Ciclo do Pecado","Identidade em Cristo","Guardando os Olhos e o Coração","A Raiz da Vergonha","Vulnerabilidade e Confissão","Renovando a Mente","Domínio Próprio como Fruto do Espírito","Reconstruindo Limites","Vitória Contra o Pecado","Aliados e Comunidade","Gatilhos Digitais","Pureza nos Relacionamentos","Perdão e Graça","Hábitos que Sustentam","Enfrentando a Solidão","Propósito além da Luta","Perseverança","Restaurando a Confiança","Alegria e Gratidão","Prevenindo Recaídas","Servindo aos Outros","Firmes até o Fim","Nova Identidade e Propósito"];
const DEV=window.CONTEUDO||{};
const dflt={t:"Reflexão do dia",tx:"O devocional deste dia ainda não foi escrito. Medite no versículo acima, ore com sinceridade e registre como foi o seu dia.",or:"Senhor, guia os meus passos hoje e fortalece a minha decisão. Amém.",ds:"Pense em uma atitude prática que sustente a sua decisão hoje."};
let D=Object.assign({start:null,e:{},contact:'',pin:'',pr:{},fav:{},fs:17},JSON.parse(localStorage.getItem(K)||'{}'));
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const add=(s,n)=>{const x=new Date(s+'T00:00');x.setDate(x.getDate()+n);return iso(x)};
const today=()=>iso(new Date()),dd=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5);
const dia=()=>Math.min(168,Math.max(1,dd(D.start,today())+1)),sem=()=>Math.ceil(dia()/7);
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('cb'+s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
function stats(){const ks=Object.keys(D.e).sort();let vit=0,rec=0,best=0,run=0,p=null;
for(const k of ks){if(D.e[k].s=='v'){vit++;run=(p&&add(p,1)==k&&D.e[p].s=='v')?run+1:1;best=Math.max(best,run)}else{rec++;run=0}p=k}
let cur=0,d=today();if(!(D.e[d]&&D.e[d].s=='v'))d=add(d,-1);
while(D.e[d]&&D.e[d].s=='v'){cur++;d=add(d,-1)}return{vit,rec,best,cur,tot:ks.length}}
let RT='',cm=0,pk='',tab='hoje',draft='',alt=false,devDay=0,filt='all',spk=false;
let T={m:10,left:600,end:0,run:false,id:0,wl:null};
const sheet=h=>{$('#sh').innerHTML=h;$('#sheet').classList.add('on')},closeS=()=>$('#sheet').classList.remove('on');
const I=(p,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/>',trail:'<circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h8a4 4 0 0 0 0-8H8a4 4 0 0 1 0-8h8"/>',book:'<path d="M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4z"/><path d="M20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',bell:'<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',back:'<path d="M15 5l-7 7 7 7"/>',chev:'<path d="M9 5l7 7-7 7"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',flame:'<path d="M12 3c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z"/>',trophy:'<path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3M12 14v4M8 21h8"/>',play:'<path d="M7 4l13 8-13 8z" fill="currentColor"/>',shield:'<path d="M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z"/><path d="M12 8v5M12 16v.5"/>',heart:'<path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2 4.5 4.5 0 0 1 8 2c0 6-8 11-8 11z"/>',cal:'<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="M5 12l5 5 9-10"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',vol:'<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6"/>',mute:'<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l4 6M21 9l-4 6"/>',restart:'<path d="M4 12a8 8 0 1 0 3-6L4 9"/><path d="M4 4v5h5"/>',share:'<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8 11l8-4M8 13l8 4"/>',chart:'<path d="M5 20V10M12 20V4M19 20v-7"/>'};
const FM=['M8 17c1-3 7-3 8 0','M8.5 16c1-1.5 6-1.5 7 0','M8.5 15.5h7','M8.5 14.5c1 1.5 6 1.5 7 0','M8 14c1 3.5 7 3.5 8 0'];
const F=i=>`<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><circle cx="9" cy="10" r=".7" fill="currentColor"/><circle cx="15" cy="10" r=".7" fill="currentColor"/><path d="${FM[i]}"/></svg>`;
const TD=["Reconhecendo a realidade e a graça de Deus.","Identificando gatilhos, padrões e escolhas.","Quem você é não é definido pela sua queda.","Disciplina prática do olhar e da atenção.","Diferenciar convicção saudável de vergonha tóxica.","O poder de não lutar sozinho.","Substituir pensamentos, não apenas suprimi-los.","Força que vem de dentro, pelo Espírito.","Cuidados práticos para proteger o caminho.","Celebrando e firmando as conquistas.","Caminhando junto com quem te apoia.","Estratégias para o ambiente digital.","Pureza e respeito nas relações.","Receber e dar perdão.","Rotinas que sustentam a decisão.","Encontrando companhia na solidão.","Vivendo para algo maior.","Seguir firme mesmo cansado.","Reconstruindo o que foi abalado.","Coração agradecido e alegre.","Reconhecer sinais e agir cedo.","Cuidar de outros fortalece você.","Terminando bem a jornada.","Uma vida nova com propósito."];
const NAV=[['hoje','home','Hoje'],['trilha','trail','Trilha'],['diario','book','Diário'],['perfil','user','Perfil']];
const beep=()=>{try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=660;o.start();o.stop(a.currentTime+.5)}catch(e){}};
let lt='';
function render(){if(!D.start)return boas();if(tab!='dev'&&!AU.paused)AU.pause();const nv=NAV.some(x=>x[0]==tab);document.body.className=(tab=='trilha'||tab=='perfil')?'dk':'';
const n=$('#nav');n.style.display=nv?'flex':'none';n.innerHTML=NAV.map(x=>`<button data-a="tab" data-v="${x[0]}" class="${tab==x[0]?'on':''}">${I(P[x[1]])}${x[2]}</button>`).join('');
const m=$('#m');m.innerHTML=({hoje,oracao,dev,diario,perfil,trilha,nota,cfg})[tab]();m.className=nv?'':'nn';if(lt!=tab){m.scrollTop=0;lt=tab}paint()}
const bk=(v='hoje')=>`<button class="ib" data-a="tab" data-v="${v}">${I(P.back)}</button>`;
function hoje(){const t=today(),en=D.e[t],st=stats(),d=dia(),w=sem(),v=V[(d-1)%V.length],due=d>1&&dd(D.lastRep||D.start,t)>=(D.freq||7),nt=en?en.n:draft;
return `<div class="top"><span class="brand"><img src="logo.png" width="28" height="28" style="border-radius:8px" alt=""> Trilha</span><button class="ib" data-a="rel" aria-label="Relatório">${I(P.bell)}${due?'<u class="dot"></u>':''}</button></div>
<div class="hi"><h1>${D.name?'Olá, '+esc(D.name)+'!':'Olá!'}</h1><button class="sos" data-a="sos">${I(P.shield,16)} SOS</button></div><p class="m" style="margin:2px 0 12px">Continue firme na sua jornada.</p>
<div class="blk" data-a="tab" data-v="trilha"><div><b>Dia ${String(d).padStart(2,'0')} de 168</b><h2>Semana ${w} ›</h2></div><svg width="56" height="56" viewBox="0 0 56 56" style="transform:rotate(-90deg)"><circle cx="28" cy="28" r="23" fill="none" stroke="#3a3a3d" stroke-width="6"/><circle cx="28" cy="28" r="23" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-dasharray="144.5" stroke-dashoffset="${144.5*(1-d/168)}"/></svg></div>
<h3>Seu progresso</h3><div class="row"><div class="stat">${I(P.flame)}<small>Sequência atual</small><b>${st.cur} dia${st.cur==1?'':'s'}</b></div><div class="stat">${I(P.trophy)}<small>Melhor sequência</small><b>${st.best} dia${st.best==1?'':'s'}</b></div></div>
<div class="card hero" data-a="tab" data-v="dev"><div><small>Ensinamento do dia</small><h3>${DEV[d]?DEV[d].t:dflt.t}</h3></div><span class="pl">${I(P.play,18)}</span></div>
<div class="card"><small>Versículo do dia</small><p class="vs">${v[0]}</p><b class="lime">${v[1]}</b></div>
${due?`<div class="card"><b>📨 Hora de enviar seu relatório</b><p class="m">Compartilhe seu progresso com ${esc(D.dn||'seu discipulador')}.</p><button class="btn" data-a="rel">Enviar relatório</button></div>`:''}
<div class="card"><b>Como foi seu dia?</b><div class="fc" style="margin:12px 0">${[0,1,2,3,4].map(i=>`<button data-a="mood" data-v="${i}" class="${(D.mood||{})[t]===i?'on':''}" aria-label="Humor ${i+1}">${F(i)}</button>`).join('')}</div>${nt?`<p class="m">“${esc(nt)}”</p>`:''}<a data-a="tab" data-v="nota">${nt?'Editar nota':'+ Adicionar nota'}</a></div>
${en&&!alt?`<div class="card"><b style="color:${en.s=='v'?'var(--g)':'var(--l)'}">${en.s=='v'?'✔ Hoje você resistiu':'✖ Hoje você recaiu'}</b><p class="m">${en.s=='v'?'Continue firme.':'Uma queda não define a sua história. Levante-se e continue.'}</p><a data-a="alt">Alterar registro</a></div>`:`<div class="row"><button class="btn" data-a="reg" data-v="v">✔ RESISTI<br><small>Estou firme!</small></button><button class="btn r" data-a="reg" data-v="r">✖ RECAÍ<br><small>Preciso me levantar!</small></button></div>`}
<div class="card rw" data-a="tab" data-v="oracao"><span class="lime">${I(P.heart)}</span><div style="flex:1"><b>Tempo com foco</b><br><small>Orar agora</small></div>${I(P.chev)}</div>`}
function trilha(){const w=sem();return `<div class="top">${bk()}<b>Trilha</b><span><button class="sos s" data-a="sos">SOS</button> <button class="ib" data-a="tab" data-v="perfil" style="display:inline-flex">${I(P.chart)}</button></span></div><h1 style="font-size:32px;margin:14px 0 0">24 Semanas</h1><p class="m" style="margin:0 0 22px">para uma nova vida</p>${TEMAS.map((x,i)=>`<div class="tr"><div class="nd ${i+1<w?'d':i+1==w?'c':''}">${i+1<w?I(P.check,18):i+1}</div><div><b>${x}</b><br><small>${TD[i]}</small></div></div>`).join('')}<button class="btn w" data-a="tab" data-v="dev">Ver detalhes da jornada</button>`}

case'cd':{const p=pdd();p.ok=1;p.dt=t;save();render();sheet(`<h3>Dia ${devDay} concluído 🙌</h3><p class="m">Agora registre, na tela Hoje, como foi o seu dia.</p><button class="btn" data-a="close">Continuar</button>`)}break;
case'trilha':tab='trilha';render();break;
case'min':T.m=+v;T.left=T.m*60;render();break;case'play':play();break;case'pause':tick();stop();render();break;case'cancel':stop();T.left=T.m*60;render();break;
case'orar':closeS();tab='oracao';render();break;case'goperfil':closeS();tab='cfg';render();break;
case'dp':devDay=Math.max(1,devDay-1);render();break;case'dn':devDay=Math.min(dia(),devDay+1);render();break;
case'fs':D.fs=D.fs>=23?16:D.fs+2;save();render();break;case'fav':D.fav[devDay]=!D.fav[devDay];save();render();break;
case'share':{const x=DEV[devDay]||dflt,m=x.t+' – Trilha Coração Branco';try{navigator.share?await navigator.share({title:m,text:m+'\n'+x.tx}):alert('Compartilhamento não disponível.')}catch(_){}}break;
case'spk':if(spk){speechSynthesis.cancel();spk=false}else{const x=DEV[devDay]||dflt,u=new SpeechSynthesisUtterance(x.t+'. '+x.tx);u.lang='pt-BR';u.onend=()=>{spk=false;render()};speechSynthesis.speak(u);spk=true}render();break;
case'filt':filt=v;render();break;
case'sct':D.name=$('#nm').value.trim();D.dn=$('#dn').value.trim();D.contact=$('#ct').value.trim();save();alert('Contato salvo.');break;
case'go':D.start=today();D.name=$('#nm').value.trim();D.dn=$('#dn').value.trim();D.contact=$('#ct').value.trim();save();closeS();render();break;
case'pin':sheet(`<h3>PIN de proteção</h3><small>4 a 6 números. Deixe vazio para remover.</small><input id="pn" type="password" inputmode="numeric" maxlength="6"><button class="btn" style="margin-top:12px" data-a="spin">Salvar</button><button class="btn g" style="margin-top:8px" data-a="close">Cancelar</button>`);break;
case'spin':{const p=$('#pn').value;if(p&&!/^\d{4,6}$/.test(p))return alert('Use de 4 a 6 números.');D.pin=p?await sha(p):'';save();closeS();render()}break;
case'unl':if(await sha($('#pn').value)==D.pin){closeS();render()}else $('#er').textContent='PIN incorreto.';break;
case'exp':{const b=new Blob([JSON.stringify(D)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='trilha-coracao-branco-backup.json';l.click()}break;
case'imp':$('#fi').click();break;
case'rst':sheet(`<h3>Reiniciar jornada</h3><p class="m">A contagem volta ao dia 1. Escolha o que fazer com o histórico.</p><button class="btn" data-a="rk">Reiniciar e manter histórico</button><button class="btn r" style="margin-top:8px" data-a="ra">Reiniciar e apagar tudo</button><button class="btn g" style="margin-top:8px" data-a="close">Cancelar</button>`);break;
case'rk':D.start=today();save();closeS();tab='hoje';render();break;
case'ra':D.start=today();D.e={};D.pr={};D.fav={};save();closeS();tab='hoje';render();break}});
document.addEventListener('change',e=>{if(e.target.id=='pf'&&e.target.files[0]){const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const s=Math.min(i.width,i.height);c.getContext('2d').drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,160,160);D.photo=c.toDataURL('image/jpeg',.8);save();render()};i.src=URL.createObjectURL(e.target.files[0])}});
const AU=new Audio();AU.preload='metadata';
function lAu(d){AU.pause();AU.err=false;AU.dataset.d=d;const x=DEV[d];if(x&&x.au){AU.src='audio/'+x.au;AU.playbackRate=D.sp||1}else AU.removeAttribute('src')}
AU.onloadedmetadata=()=>{const p=(D.ap||{})[AU.dataset.d];if(p&&p<AU.duration-3)AU.currentTime=p;if(tab=='dev')render()};
AU.ontimeupdate=()=>{const s=$('#sk'),tt=$('#tt');if(s){s.max=AU.duration||0;s.value=AU.currentTime}if(tt)tt.textContent=fmt(Math.floor(AU.currentTime))+' / '+fmt(Math.floor(AU.duration||0));const d=AU.dataset.d;if(d&&Math.floor(AU.currentTime)%5==0){(D.ap=D.ap||{})[d]=Math.floor(AU.currentTime);save()}};
AU.onplay=AU.onpause=()=>{const b=$('#apb');if(b)b.innerHTML=AU.paused?I(P.play,24):'❚❚'};
AU.onended=()=>{const d=AU.dataset.d;((D.pd=D.pd||{})[d]=D.pd[d]||{}).ou=1;(D.ap=D.ap||{})[d]=0;save();if(tab=='dev')render()};
AU.onerror=()=>{if(AU.getAttribute('src')){AU.err=true;if(tab=='dev')render()}};
const pdd=()=>((D.pd=D.pd||{})[devDay]=D.pd[devDay]||{});
document.addEventListener('input',e=>{const t=e.target;if(t.id=='sk')AU.currentTime=+t.value;if(t.dataset&&t.dataset.q!==undefined){const p=pdd();(p.r=p.r||[])[+t.dataset.q]=t.value;save()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.c!==undefined){const p=pdd();(p.c=p.c||[])[+t.dataset.c]=t.checked;save()}});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();if(D.start&&D.pin)lock();
</script></body></html>
